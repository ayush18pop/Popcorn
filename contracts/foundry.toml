# Popcorn contracts. No external dependencies: tests use a minimal Vm interface.
# solc 0.8.33 (scripts/install-solc.sh); evm_version prague, the opcode set the EIP-8141 devnets execute.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.33"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
# Core tests read the Core build output: run core/build.sh first.
fs_permissions = [{ access = "read", path = "test/fixtures" }, { access = "read", path = "core/out" }]

[fuzz]
runs = 1000
